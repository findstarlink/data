# Generated initially using github-actions-wizard (https://github.com/cmdr2/github-actions-wizard)

name: Deploy Data
run-name: Deploy Data
on:
  push:
    branches:
    - main
jobs:
  deploy_to_cloudflare_pages_on_main_push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Create Javascript files
      run: |-
        echo "var SAT_DATA = " > sat-data.js
        cat sat-data.json >> sat-data.js

        echo "var STRINGS = " > strings_en-US.js
        cat strings_en-US.json >> strings_en-US.js

        # Fetch the current CelesTrak data. A 403 means CelesTrak's data hasn't changed
        # since our last update, so we fall back to our own published mirror from
        # Cloudflare Pages to build a complete bundle. Any other failure (e.g. 5xx,
        # timeout) must fail the workflow, since we wouldn't have up-to-date data.
        CELESTRAK_URL="https://celestrak.org/NORAD/elements/supplemental/sup-gp.php?FILE=starlink&FORMAT=json"
        MIRROR_URL="https://data.findstarlink.com/celestrak.json"
        HTTP_CODE=$(curl -s --retry 3 --max-time 120 -w '%{http_code}' -o celestrak.json "$CELESTRAK_URL")
        case "$HTTP_CODE" in
          200)
            echo "Fetched fresh data from CelesTrak (HTTP $HTTP_CODE)"
            ;;
          403)
            echo "CelesTrak returned 403 (data unchanged), falling back to our Cloudflare Pages mirror"
            curl -f --retry 3 --max-time 120 "$MIRROR_URL" -o celestrak.json
            ;;
          *)
            echo "CelesTrak returned unexpected HTTP status: $HTTP_CODE" >&2
            exit 1
            ;;
        esac
        echo "var CELESTRAK = " > celestrak.js
        cat celestrak.json >> celestrak.js
    - name: Copy files into the build
      run: |-
        mkdir build
        cp \
          sat-data.json sat-data.js \
          strings_en-US.json strings_en-US.js \
          celestrak.json celestrak.js \
          build/
    - name: Deploy to Cloudflare Pages
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        command: pages deploy build --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }} --commit-dirty=true
    - name: Check if commit message has "RELEASE:" in it
      id: check_release
      run: |
        if git log -1 --pretty=%B | grep -q "RELEASE:"; then
          echo "is_release=true" >> $GITHUB_OUTPUT
        else
          echo "is_release=false" >> $GITHUB_OUTPUT
        fi

        # create a version based on current date and time
        VERSION=$(date +'%Y.%m.%d.%H%M')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
    - name: Create a release if necessary
      if: steps.check_release.outputs.is_release == 'true'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.check_release.outputs.version }}
        name: v${{ steps.check_release.outputs.version }}
        body: |
          ${{ env.COMMIT_MSG }}
        token: ${{ secrets.CUSTOM_GITHUB_TOKEN }}
